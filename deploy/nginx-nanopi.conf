# /etc/nginx/sites-available/epochlab  (on the NanoPi R5C)
# Replace VM_IP. Issue the certificate with: certbot --nginx -d spherex.pitipo-app.com
server {
    listen 80;
    server_name spherex.pitipo-app.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name spherex.pitipo-app.com;
    # ssl_certificate / ssl_certificate_key are added by certbot

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Basic abuse protection: analyses hit IRSA, keep them rate-limited
    limit_req zone=epochlab_jobs burst=3 nodelay;

    location / {
        proxy_pass http://VM_IP:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
# In the http {} block of nginx.conf:
# limit_req_zone $binary_remote_addr zone=epochlab_jobs:10m rate=6r/m;
